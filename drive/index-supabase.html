<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Drive Vault</title><style>body{margin:0;font-family:system-ui,sans-serif;background:#08111f;color:#eef4ff}.wrap{max-width:980px;margin:auto;padding:24px}.card{background:#0f1d31;border:1px solid #233a59;border-radius:18px;padding:16px;margin:12px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid #2a4264;background:#091525;color:#fff}button,a.btn{display:inline-block;padding:10px 14px;border-radius:12px;border:0;background:#34d399;color:#06121a;font-weight:700;text-decoration:none;cursor:pointer}.muted{color:#9fb0c8}.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item h3{margin:0 0 6px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.secondary{background:#1e3350!important;color:#fff!important}.danger{background:#7f1d1d!important;color:#fff!important}@media(max-width:700px){.row,.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Drive Vault</h1><div class="muted">คลังลิงก์ Google Drive แบบฐานข้อมูลกลาง</div></div><div id="status" class="muted">กำลังเชื่อมต่อ...</div></div><div class="card"><div class="row"><input id="title" placeholder="ชื่อลิงก์"><input id="category" placeholder="หมวดหมู่ เช่น งานสอน"><input class="full" id="url" placeholder="ลิงก์ Google Drive"><input class="full" id="description" placeholder="รายละเอียด (ถ้ามี)"><button class="full" id="add">+ เพิ่มลิงก์</button></div></div><div class="card"><input id="search" placeholder="ค้นหาชื่อ หมวดหมู่ หรือรายละเอียด"></div><div id="count" class="muted"></div><div id="list" class="grid"></div></div><script>
const SUPABASE_URL='https://cxfmdavmadgoywushebc.supabase.co';
const API_KEY='sb_publishable_BuLy-35ixJBaEUjIDVSpdw_5dDWDWz9';
const endpoint=SUPABASE_URL+'/rest/v1/drive_links';
let items=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function driveDownload(u){const m=u.match(/\/file\/d\/([\w-]+)/)||u.match(/[?&]id=([\w-]+)/);return m?`https://drive.google.com/uc?export=download&id=${m[1]}`:u}
async function api(path='',opts={}){const r=await fetch(endpoint+path,{...opts,headers:{apikey:API_KEY,'Content-Type':'application/json',Prefer:'return=representation',...(opts.headers||{})}});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[]}
function render(){const q=$('search').value.trim().toLowerCase();const rows=items.filter(x=>[x.title,x.category,x.description].join(' ').toLowerCase().includes(q));$('count').textContent=`${rows.length} รายการ`;$('list').innerHTML=rows.length?rows.map(x=>`<div class="card item"><h3>${esc(x.title)}</h3><div class="muted">${esc(x.category||'อื่นๆ')}</div><p>${esc(x.description||'')}</p><div class="actions"><a class="btn" target="_blank" rel="noopener" href="${esc(driveDownload(x.url))}">ดาวน์โหลด</a><a class="btn secondary" target="_blank" rel="noopener" href="${esc(x.url)}">เปิด Drive</a><button class="danger" onclick="del(${x.id})">ลบ</button></div></div>`).join(''):'<div class="card muted">ยังไม่มีรายการ</div>'}
async function load(){try{items=await api('?select=*&order=created_at.desc');$('status').textContent='เชื่อมต่อฐานข้อมูลแล้ว';render()}catch(e){$('status').textContent='เชื่อมต่อไม่สำเร็จ';console.error(e)}}
$('search').addEventListener('input',render);
$('add').onclick=async()=>{const title=$('title').value.trim(),url=$('url').value.trim(),category=$('category').value.trim()||'อื่นๆ',description=$('description').value.trim();if(!title||!url)return alert('กรอกชื่อและลิงก์ก่อน');try{await api('',{method:'POST',body:JSON.stringify({title,url,category,description})});$('title').value='';$('url').value='';$('description').value='';await load()}catch(e){alert('เพิ่มไม่สำเร็จ');console.error(e)}};
window.del=async id=>{if(!confirm('ลบลิงก์นี้?'))return;try{await api('?id=eq.'+id,{method:'DELETE'});await load()}catch(e){alert('ลบไม่สำเร็จ')}};
load();
</script></body></html>
